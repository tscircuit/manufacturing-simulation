<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Browser simulation of a 6′2″ operator assembling and packing NEMA17 motor controller units on the unit 322 floor.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Unit 322 Line Sim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D viewport; floating instrument panels (controls top-left, cycle timing top-right, camera + status along the bottom). */
:root{
  --bg:#e7ebee; --panel:rgba(255,255,255,.9); --fg:#18212b; --muted:#5a6876; --line:#c9d1d9;
  --accent:#b35f00; --accent-fg:#fff; --ok:#1d7f4f; --btn:#f3f5f7;
  --scene-bg:#dfe5ea; --floor:#c9cfd4; --floor-line:#b4bcc3; --wall:#f2f4f5;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1116; --panel:rgba(17,24,31,.9); --fg:#e4eaf0; --muted:#8a98a7; --line:#2a3541;
  --accent:#ffc533; --accent-fg:#1a1400; --ok:#58d39a; --btn:#1b2530;
  --scene-bg:#0c1116; --floor:#262e36; --floor-line:#35404b; --wall:#3a4550; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c1116; --panel:rgba(17,24,31,.9); --fg:#e4eaf0; --muted:#8a98a7; --line:#2a3541;
  --accent:#ffc533; --accent-fg:#1a1400; --ok:#58d39a; --btn:#1b2530;
  --scene-bg:#0c1116; --floor:#262e36; --floor-line:#35404b; --wall:#3a4550; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.panel{position:absolute;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px);max-height:calc(100% - 120px);overflow:auto}
.ctl{left:max(16px,env(safe-area-inset-left,0px));width:min(290px,calc(100% - 32px))}
.timing{right:max(16px,env(safe-area-inset-right,0px));width:min(300px,calc(100% - 32px))}
summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:baseline;justify-content:space-between;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--muted);font-size:11px}
details:not([open]) summary::after{content:"▸"}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.body{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px}
.grp{display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:6px 9px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,summary:focus-visible,#c:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0}
.seg button{border-radius:0}.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0;border-left:0}
.stack button{text-align:left;width:100%}
.facts{font-family:var(--mono);font-size:11px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0}
.facts dd{margin:0;color:var(--fg);font-variant-numeric:tabular-nums}
ol#rows{list-style:none;margin:0;padding:0 12px;counter-reset:s}
ol#rows li{counter-increment:s;display:grid;grid-template-columns:18px 1fr auto;gap:6px;padding:4px 0;border-top:1px solid var(--line);color:var(--muted)}
ol#rows li::before{content:counter(s);font-family:var(--mono);font-size:11px}
ol#rows li.act{color:var(--fg);font-weight:600}
ol#rows li.act::before{color:var(--accent)}
ol#rows li.done{color:var(--fg)}
ol#rows li.done::before{content:"✓";color:var(--ok)}
.t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px 11px;border-top:1px solid var(--line);margin-top:2px}
.tot b{font-weight:600}
.bottom{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
.bottom>*{pointer-events:auto}
.status{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;min-width:0;max-width:520px;flex:1 1 240px}
#now{font-weight:600}
#hint{color:var(--muted);font-size:11.5px}
#prompt{color:var(--fg);margin-top:3px}
kbd{font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--accent-fg);border-radius:3px;padding:1px 5px;font-weight:600}
.cam{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cam label{display:flex;gap:5px;align-items:center;color:var(--muted);padding:0 4px}
#stick{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-radius:50%;background:var(--panel);border:1px solid var(--line);touch-action:none}
#knob{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:var(--accent)}
#actE{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;font-weight:600;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
@media (max-width:720px){ .timing{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-height:45%} .panel{max-height:55%} }
</style>
</head>

<div id="app">
  <canvas id="c" tabindex="0" aria-label="3D view of the unit 322 floor with the operator and work stations"></canvas>

  <section class="panel ctl"><details open id="ctlD">
    <summary><span><span class="eyebrow">2325 · Unit 322</span><br>Line sim</span></summary>
    <div class="body">
      <div class="grp">
        <span class="eyebrow">Mode</span>
        <div class="seg"><button id="mSim" aria-pressed="true">Simulation</button><button id="mGame" aria-pressed="false">Game</button></div>
      </div>
      <div class="grp stack">
        <span class="eyebrow">Scenario</span>
        <button id="scWalk">Walk the floor</button>
        <button id="scTool">Pick up the screwdriver</button>
        <button id="scJob">Assemble and pack a motor</button>
      </div>
      <div class="grp">
        <span class="eyebrow">Clock</span>
        <div class="row">
          <button id="pause" aria-pressed="false">Pause</button>
          <select id="speed" aria-label="Simulation speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
          <button id="reset">Reset</button>
        </div>
      </div>
      <dl class="facts">
        <dt>Operator</dt><dd>6′2″ · 1.88 m</dd>
        <dt>Floor</dt><dd>18′3½″ × 47′5¼″</dd>
        <dt>Tables</dt><dd>3 × 6′ folding, 29″ high</dd>
      </dl>
    </div>
  </details></section>

  <section class="panel timing"><details open id="timD">
    <summary><span>Cycle timing</span><span class="t" id="totalTop">0.0 s</span></summary>
    <ol id="rows"></ol>
    <div class="tot">
      <span>Walking and transit</span><span class="t" id="tWalk">0.0 s</span>
      <b>Cycle total</b><b class="t" id="tTotal">0.0 s</b>
    </div>
  </details></section>

  <div id="stick" hidden><div id="knob"></div></div>
  <button id="actE" hidden>Act</button>

  <div class="bottom">
    <div class="status">
      <div id="now">Walking the floor</div>
      <div id="prompt" hidden></div>
      <div id="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</div>
    </div>
    <div class="cam">
      <button id="cOver" aria-pressed="false">Overview</button>
      <button id="cFollow" aria-pressed="true">Follow</button>
      <button id="cClose" aria-pressed="false">Close-up</button>
      <label><input type="checkbox" id="auto" checked> Auto close-up</label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T=THREE, $=id=>document.getElementById(id);
const V=(x,y,z)=>new T.Vector3(x||0,y||0,z||0);
const QI=new T.Quaternion();
const qE=(x,y,z)=>new T.Quaternion().setFromEuler(new T.Euler(x,y,z));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>k*k*(3-2*k);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ================= LAYOUT (metres). Edit here to move things. =================
   Room: x runs west→east (0..RW), z runs north→south (0..RL). Entry door is in the NE corner.
   Table local frame: long axis = x, operator stands on the +z side facing -z. */
const FT=0.3048;
const RW=18.291*FT, RL=47.437*FT, RLW=46.02*FT, NOTCH=5.8*FT, RH=2.74;
const BATH={x0:RW-3.4*FT, z0:5.65*FT, z1:11.36*FT};
const LAYOUT={
  tables:{
    A:{x:0.45,    z:5.5, rot: Math.PI/2, label:'Assembly bench'},
    B:{x:RW-0.45, z:5.6, rot:-Math.PI/2, label:'P2S printer'},
    C:{x:RW-0.45, z:9.2, rot:-Math.PI/2, label:'Pack-out'},
  },
  start:{x:2.9,z:3.0,yaw:0.2},
  patrol:[[2.8,1.3],[1.7,4.0],[2.9,7.6],[1.6,12.4],[3.9,13.0],[3.5,8.0],[3.2,3.2]],
};
const TOP=0.74, TL=1.83, TD=0.76;          // 6' x 30" x 29" folding table
const HUMAN_H=74*0.0254;                    // 6'2"
const PRX=-0.35, PRZ=0.05;                  // printer position on table B

/* ================= renderer / scene ================= */
const canvas=$('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(42,1,0.02,80);
const hemi=new T.HemisphereLight(0xffffff,0x8090a0,0.75); scene.add(hemi);
const sun=new T.DirectionalLight(0xffffff,0.75); sun.position.set(RW/2-5,10,RL/2-3); sun.target.position.set(RW/2,0,RL/2);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:30}); sun.shadow.bias=-0.0006;
scene.add(sun,sun.target);
const fill=new T.DirectionalLight(0xffffff,0.25); fill.position.set(RW+4,5,RL/2+4); scene.add(fill);

const M=(color,o)=>new T.MeshStandardMaterial(Object.assign({color,roughness:0.7,metalness:0},o||{}));
function mesh(geo,mat,x,y,z){const m=new T.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); m.castShadow=true; m.receiveShadow=true; return m;}
const bx=(w,h,d,mat,x,y,z)=>mesh(new T.BoxGeometry(w,h,d),mat,x,y,z);
const cy=(r1,r2,h,mat,x,y,z,seg)=>mesh(new T.CylinderGeometry(r1,r2,h,seg||20),mat,x,y,z);
function octShape(size,clip){const h=size/2,c=h-clip,s=new T.Shape();
  [[-c,-h],[c,-h],[h,-c],[h,c],[c,h],[-c,h],[-h,c],[-h,-c]].forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath(); return s;}
function hole(x,y,r){const p=new T.Path(); p.absarc(x,y,r,0,Math.PI*2,true); return p;}
function extrudeY(shape,depth,mat,y){const g=new T.ExtrudeGeometry(shape,{depth,bevelEnabled:false,curveSegments:20}); g.rotateX(-Math.PI/2); return mesh(g,mat,0,y||0,0);}

/* ---------- room (static) ---------- */
const matFloor=M(0xcccccc,{roughness:0.95,side:T.DoubleSide}), matWall=M(0xeeeeee,{roughness:0.95}), matTrim=M(0x7b8794);
const matGlass=new T.MeshBasicMaterial({color:0x9fd0ee,transparent:true,opacity:0.16,depthWrite:false});
let floorTex=null;
function makeFloorTex(){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  g.fillStyle=css('--floor')||'#ccc'; g.fillRect(0,0,128,128); g.strokeStyle=css('--floor-line')||'#bbb'; g.lineWidth=2; g.strokeRect(0,0,128,128);
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(1/(2*FT),1/(2*FT)); t.encoding=T.sRGBEncoding; t.anisotropy=4; return t;
}
function applyTheme(){
  scene.background=new T.Color(css('--scene-bg')||'#dde');
  if(floorTex) floorTex.dispose(); floorTex=makeFloorTex(); matFloor.map=floorTex; matFloor.color.set(0xffffff); matFloor.needsUpdate=true;
  matWall.color.set(css('--wall')||'#eee');
}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

function wallPlane(x1,z1,x2,z2,y0,y1,mat){ // single-sided, faces the room so you can see in from outside
  const len=Math.hypot(x2-x1,z2-z1), m=new T.Mesh(new T.PlaneGeometry(len,y1-y0),mat||matWall);
  let nx=-(z2-z1)/len, nz=(x2-x1)/len; const mx=(x1+x2)/2, mz=(z1+z2)/2;
  if(nx*(RW/2-mx)+nz*(RL/2-mz)<0){nx=-nx;nz=-nz;}
  m.position.set(mx,(y0+y1)/2,mz); m.rotation.y=Math.atan2(nx,nz); m.receiveShadow=true; scene.add(m); return m;
}
(function buildRoom(){
  const s=new T.Shape(); s.moveTo(0,0); s.lineTo(RW,0); s.lineTo(RW,RL); s.lineTo(NOTCH,RL); s.lineTo(NOTCH,RLW); s.lineTo(0,RLW); s.closePath();
  const fg=new T.ShapeGeometry(s); fg.rotateX(Math.PI/2); const f=new T.Mesh(fg,matFloor); f.receiveShadow=true; scene.add(f);
  wallPlane(0,0,RW,0,0,RH);                                   // north
  wallPlane(RW,1.25,RW,RL,0,RH); wallPlane(RW,0,RW,1.25,2.1,RH); // east, with entry door opening
  wallPlane(RW,RL,NOTCH,RL,0,RH); wallPlane(NOTCH,RL,NOTCH,RLW,0,RH); wallPlane(NOTCH,RLW,0,RLW,0,RH); // south + notch
  wallPlane(0,RLW,0,0,0,0.8); wallPlane(0,RLW,0,0,2.5,RH); wallPlane(0,RLW,0,0,0.8,2.5,matGlass);    // west window wall
  [4.9,9.1,13.2,17.2,21.1,32.1,36.5,41.3].forEach(ft=>scene.add(bx(0.04,1.7,0.04,matTrim,0.02,1.65,ft*FT)));
  scene.add(bx(0.12,RH,0.9,matWall,0.06,RH/2,26.4*FT));       // structural column on the window wall
  const door=new T.Group(); door.position.set(RW-0.02,0,0.06); door.rotation.y=-1.25; door.add(bx(0.045,2.05,1.1,M(0x8a6a48),0,1.025,0.55)); scene.add(door);
  // washroom
  const b=BATH, t=0.1, dz0=6.9*FT, dz1=9.4*FT;
  scene.add(bx(RW-b.x0,RH,t,matWall,(b.x0+RW)/2,RH/2,b.z0), bx(RW-b.x0,RH,t,matWall,(b.x0+RW)/2,RH/2,b.z1));
  scene.add(bx(t,RH,dz0-b.z0,matWall,b.x0,RH/2,(b.z0+dz0)/2), bx(t,RH,b.z1-dz1,matWall,b.x0,RH/2,(dz1+b.z1)/2), bx(t,RH-2.05,dz1-dz0,matWall,b.x0,2.05+(RH-2.05)/2,(dz0+dz1)/2));
  const bd=new T.Group(); bd.position.set(b.x0,0,dz0); bd.rotation.y=-0.5; bd.add(bx(0.04,2.03,dz1-dz0,M(0x8a6a48),0,1.015,(dz1-dz0)/2)); scene.add(bd);
  const por=M(0xf4f4f0,{roughness:0.3});
  scene.add(bx(0.38,0.4,0.5,por,RW-0.32,0.2,b.z1-0.5), bx(0.4,0.42,0.18,por,RW-0.3,0.6,b.z1-0.16), bx(0.42,0.12,0.36,por,RW-0.3,0.82,b.z0+0.4));
})();

function label(text,w){
  const c=document.createElement('canvas'); c.width=512; c.height=96; const g=c.getContext('2d');
  g.fillStyle='rgba(14,20,26,.82)'; g.fillRect(0,0,512,96); g.fillStyle='#ffc533'; g.fillRect(0,0,10,96);
  g.fillStyle='#fff'; g.font='600 46px "IBM Plex Sans",system-ui,sans-serif'; g.textBaseline='middle'; g.fillText(text,30,50);
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding;
  const s=new T.Sprite(new T.SpriteMaterial({map:t,depthWrite:false})); s.scale.set(w,w*96/512,1); return s;
}

/* ================= parts ================= */
const mSteel=M(0xb9bec4,{metalness:0.8,roughness:0.35}), mBlack=M(0x1c1e21,{roughness:0.5}), mDark=M(0x2c3035,{roughness:0.6});
function makeTable(){
  const g=new T.Group(), top=M(0xe6e4dd,{roughness:0.85}), leg=M(0x6f757c,{metalness:0.6,roughness:0.45});
  g.add(bx(TL,0.045,TD,top,0,TOP-0.0225,0));
  [-0.7,0.7].forEach(x=>{ [-0.28,0.28].forEach(z=>g.add(cy(0.014,0.014,TOP-0.045,leg,x,(TOP-0.045)/2,z,10))); g.add(bx(0.025,0.025,0.56,leg,x,0.2,0)); });
  return g;
}
function makeScrew(){ const g=new T.Group(); g.add(cy(0.00275,0.00275,0.003,mBlack,0,0.0015,0,14), cy(0.0015,0.0015,0.016,mSteel,0,-0.008,0,10), cy(0.0012,0.0012,0.0004,mSteel,0,0.0031,0,6)); return g; }
function makeMotor(){ // origin = centre of mounting face, +y toward the back face
  const g=new T.Group(), cap=M(0xc7ccd1,{metalness:0.7,roughness:0.4});
  g.add(extrudeY(octShape(0.0423,0.004),0.009,cap,0), extrudeY(octShape(0.0415,0.006),0.022,mBlack,0.009), extrudeY(octShape(0.0423,0.004),0.009,mDark,0.031));
  g.add(cy(0.011,0.011,0.002,cap,0,-0.001,0), cy(0.0025,0.0025,0.024,mSteel,0,-0.012,0,14), bx(0.016,0.006,0.005,M(0xf2f2ee),0,0.035,-0.0235));
  g.screws=[[-1,-1],[1,-1],[1,1],[-1,1]].map(p=>{const s=makeScrew(); s.position.set(p[0]*0.0155,0.040,p[1]*0.0155); s.userData.h=p; g.add(s); return s;});
  return g;
}
function makeSpacer(){ // from backface-spacer-4mm.scad: face 42, pitch 31, 1 mm base, 3 mm sleeves OD 10, bore 3.4, rotor hole 22.6, 5 mm corner clip
  const g=new T.Group(), m=M(0xf07a1c,{roughness:0.8}), P=0.0155;
  const s=octShape(0.042,0.005); s.holes.push(hole(0,0,0.0113)); [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(p=>s.holes.push(hole(p[0]*P,p[1]*P,0.0017)));
  g.add(extrudeY(s,0.001,m,0));
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(p=>{const r=new T.Shape(); r.absarc(0,0,0.005,0,Math.PI*2,false); r.holes.push(hole(0,0,0.0017)); const e=extrudeY(r,0.003,m,0.001); e.position.x=p[0]*P; e.position.z=p[1]*P; g.add(e);});
  return g;
}
function makePCB(){
  const g=new T.Group(), P=0.0155, gold=M(0xd9b24a,{metalness:0.8,roughness:0.3});
  const s=octShape(0.042,0.005); [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(p=>s.holes.push(hole(p[0]*P,p[1]*P,0.0017)));
  g.add(extrudeY(s,0.0016,M(0x14633a,{roughness:0.45}),0));
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(p=>{const r=new T.Shape(); r.absarc(0,0,0.0031,0,Math.PI*2,false); r.holes.push(hole(0,0,0.0017)); const e=extrudeY(r,0.00005,gold,0.0016); e.position.x=p[0]*P; e.position.z=p[1]*P; g.add(e);});

/* ================= coroutine primitives ================= */
function* wait(t){ while(t>0) t-=yield; }
function* tween(dur,fn){ let t=0; fn(0); while(t<dur){ t+=yield; fn(ease(Math.min(1,t/dur))); } }
function* par(){ let live=Array.prototype.slice.call(arguments).filter(g=>!g.next().done); while(live.length){ const dt=yield; live=live.filter(g=>!g.next(dt).done); } }
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return d;};
function* walkTo(x,z,yawEnd){
  const path=findPath({x:H.pos.x,z:H.pos.z},{x,z});
  for(let i=0;i<path.length;i++){ const p=path[i], last=i===path.length-1;
    for(;;){ const dt=yield, dx=p.x-H.pos.x, dz=p.z-H.pos.z, d=Math.hypot(dx,dz); if(d<(last?0.012:0.08)) break;
      const da=angDiff(H.yaw,Math.atan2(dx,dz)); H.yaw+=clamp(da,-6*dt,6*dt);
      let sp=1.35*Math.max(0.15,Math.cos(clamp(da,-1.4,1.4))); if(last) sp=Math.min(sp,d*4+0.12);
      const st=Math.min(d,sp*dt); H.pos.x+=dx/d*st; H.pos.z+=dz/d*st; H.speed=sp; } }
  H.speed=0;
  if(yawEnd!==undefined) for(;;){ const dt=yield, da=angDiff(H.yaw,yawEnd); if(Math.abs(da)<0.01){H.yaw=yawEnd;break;} H.yaw+=clamp(da,-4*dt,4*dt); }
}
function* walkToStand(st){ const p=standPoint(st); yield* walkTo(p.x,p.z,p.yaw); }
const objPt=(o,p)=>()=>{ o.updateWorldMatrix(true,false); return o.localToWorld(p?p.clone():V()); };
function* reach(h,fn,dur,lift){ const from=h.pinchWorld(); h.active=true; h.track=null; if(lift===undefined) lift=0.04;
  yield* tween(dur||0.55,k=>{ h.goal.lerpVectors(from,fn(),k); h.goal.y+=Math.sin(Math.PI*k)*lift; }); h.track=fn; }
function* grab(h,o,p,curl,dur){ yield* reach(h,objPt(o,p),dur); h.curlGoal=curl===undefined?0.9:curl; yield* wait(0.2); }
function* letGo(h){ h.curlGoal=0.15; yield* wait(0.16); h.track=null; h.active=false; h.held=null; h.dirGoal.copy(DIR_DEF); }
function hold(h,o){ h.g.attach(o); h.held=o; }
function* carryPose(h){ yield* reach(h,()=>{H.g.updateWorldMatrix(true,false); return H.g.localToWorld(V(h.side*0.17,1.03,0.3));},0.55,0.02); }
function* moveObj(o,h,parent,pos,quat,dur,lift){   // pos/quat are in parent's frame; motion is tweened in world space

  yield* moveObj(o,h,scene,V(b.x,top,b.z),qb,dur||0.8);

}

addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
(function stick(){ const el=$('stick'), kn=$('knob'); let id=null;
  const mv=e=>{ const r=el.getBoundingClientRect(); let x=(e.clientX-r.left-52)/40, y=(e.clientY-r.top-52)/40; const l=Math.hypot(x,y); if(l>1){x/=l;y/=l;} stickX=x; stickY=-y; kn.style.transform='translate('+x*32+'px,'+y*32+'px)'; };
  el.addEventListener('pointerdown',e=>{ id=e.pointerId; el.setPointerCapture(id); mv(e); }); el.addEventListener('pointermove',e=>{ if(e.pointerId===id) mv(e); });
  const up=()=>{ id=null; stickX=stickY=0; kn.style.transform=''; }; el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  $('actE').onclick=()=>{ const a=actions(); act(a.E?'E':'F'); }; })();
function gameStep(dt){
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stickX, iy=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)+stickY;
  const l=Math.hypot(ix,iy); if(l<0.15){ H.speed=0; return; } if(l>1){ix/=l;iy/=l;}
  const fx=-Math.sin(cam.yaw), fz=-Math.cos(cam.yaw), dx=fx*iy-fz*ix, dz=fz*iy+fx*ix, sp=1.5*Math.min(1,l);
  H.yaw+=clamp(angDiff(H.yaw,Math.atan2(dx,dz)),-9*dt,9*dt);
  const nx=H.pos.x+dx*sp*dt, nz=H.pos.z+dz*sp*dt; let moved=false;
  if(isFree(nx,H.pos.z,0.25)){H.pos.x=nx;moved=true;} if(isFree(H.pos.x,nz,0.25)){H.pos.z=nz;moved=true;} H.speed=moved?sp:0;
}

/* ================= camera ================= */
const cam={mode:'follow',yaw:-1.15,pitch:0.5,d:6,t:V(RW/2,1,3),pan:V(),dists:{overview:19,follow:5.2,close:0.9},focus:null,autoSet:false};
let curStation=null;
function setCam(m){ cam.mode=m; cam.pan.set(0,0,0); ['Over','Follow','Close'].forEach(n=>$('c'+n).setAttribute('aria-pressed',({Over:'overview',Follow:'follow',Close:'close'})[n]===m));
  if(m==='overview'){ cam.pitch=0.95; cam.yaw=innerWidth>innerHeight?Math.PI/2:0; } }
function camForOp(op){ cam.focus=op.focus; if(!$('auto').checked) return; cam.dists.close=op.view.dist;
  const key=op.stand.t+op.view.az; if(curStation!==key){ curStation=key; cam.yaw=standPoint(op.stand).yaw+Math.PI+op.view.az; cam.pitch=op.view.el; }
  setCam('close'); cam.autoSet=true; }
function camAfterOp(){ if(cam.autoSet&&$('auto').checked&&cam.mode==='close'){ const n=OPS[Wd.opIdx]; if(!n||Wd.freeTool||mode==='game'||n.stand.t!==(OPS[Wd.opIdx-1]||{stand:{}}).stand.t){ setCam('follow'); curStation=null; } } cam.autoSet=false; }
$('cOver').onclick=()=>setCam('overview'); $('cFollow').onclick=()=>setCam('follow'); $('cClose').onclick=()=>{ setCam('close'); };
function camUpdate(dt){
  let tg; if(cam.mode==='overview') tg=V(RW/2,0.4,RL/2); else if(cam.mode==='follow') tg=V(H.pos.x,1.05,H.pos.z);
  else tg=(Wd.cur>=0||Wd.busy)&&cam.focus?cam.focus():H.R.pinchWorld();
  tg.add(cam.pan); cam.t.lerp(tg,1-Math.exp(-dt*6)); cam.d+=(cam.dists[cam.mode]-cam.d)*(1-Math.exp(-dt*5));
  const cp=Math.cos(cam.pitch); camera.position.set(cam.t.x+cam.d*Math.sin(cam.yaw)*cp,cam.t.y+cam.d*Math.sin(cam.pitch),cam.t.z+cam.d*Math.cos(cam.yaw)*cp); camera.lookAt(cam.t);
}
(function pointer(){ const pts=new Map(); let pinch=0;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button}); canvas.focus(); });
  canvas.addEventListener('pointermove',e=>{ const p=pts.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(pts.size===2){ const a=[...pts.values()], d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); if(pinch) zoom(pinch/d); pinch=d; return; }
    if(p.b===2||e.shiftKey){ const k=cam.d*0.0016, rx=Math.cos(cam.yaw), rz=-Math.sin(cam.yaw); cam.pan.x-=rx*dx*k; cam.pan.z-=rz*dx*k; cam.pan.y+=dy*k; }
    else { cam.yaw-=dx*0.006; cam.pitch=clamp(cam.pitch+dy*0.005,0.03,1.52); } });
  const up=e=>{ pts.delete(e.pointerId); pinch=0; }; canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  function zoom(f){ cam.dists[cam.mode]=clamp(cam.dists[cam.mode]*f,0.14,34); }
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoom(Math.exp(e.deltaY*0.0012)); },{passive:false}); })();

/* ================= HUD ================= */
const fmt=t=>t>=60?Math.floor(t/60)+':'+(t%60<10?'0':'')+(t%60).toFixed(1):t.toFixed(1)+' s';
let rowEls=[];
function renderRows(){ const ol=$('rows'); ol.innerHTML=''; rowEls=OPS.map(op=>{ const li=document.createElement('li'), a=document.createElement('span'), b=document.createElement('span'); a.textContent=op.label; b.className='t'; b.textContent='–'; li.append(a,b); ol.append(li); return {li,b}; }); }
const ring=new T.Mesh(new T.RingGeometry(0.2,0.26,40),new T.MeshBasicMaterial({color:0xffc533,transparent:true,opacity:0.8,side:T.DoubleSide,depthWrite:false})); ring.rotation.x=-Math.PI/2; scene.add(ring);
let lastHud='';
function hud(now){
  let sum=0; OPS.forEach((op,i)=>{ const t=Wd.times[i]; sum+=t; const r=rowEls[i], cls=i===Wd.cur?'act':(i<Wd.opIdx?'done':''); if(r.li.className!==cls) r.li.className=cls; const s=t>0?fmt(t):'–'; if(r.b.textContent!==s) r.b.textContent=s; });
  $('tWalk').textContent=fmt(Math.max(0,Wd.jobT-sum)); $('tTotal').textContent=$('totalTop').textContent=fmt(Wd.jobT);
  const a=actions(), pr=$('prompt'); let html='';
  if(a.E) html+='<kbd>E</kbd> '+a.E.label+'  '; if(a.F) html+='<kbd>F</kbd> '+a.F.label;
  let st=statusText; const nxt=OPS[Wd.opIdx];
  if(mode==='game'&&!task&&!html&&nxt&&!Wd.freeTool) st='Next: '+nxt.label.toLowerCase()+' at the '+tableOf(nxt.stand.t).label.toLowerCase();
  if(html!==lastHud){ pr.innerHTML=html; pr.hidden=!html; lastHud=html; } if($('now').textContent!==st) $('now').textContent=st;
  const show=nxt&&!Wd.busy&&!Wd.freeTool&&(mode==='game'||Wd.jobActive); ring.visible=!!show;
  if(show){ const p=standPoint(nxt.stand); ring.position.set(p.x,0.012,p.z); ring.material.opacity=0.55+0.3*Math.sin(now*0.005); }
}

/* ================= main loop ================= */
function resize(){ const w=canvas.clientWidth, h=canvas.clientHeight; if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); } }
function simStep(dt){
  if(task){ try{ if(task.next(dt).done) task=null; }catch(e){ console.error(e); task=null; say('Scenario stopped: '+e.message); } }
  else if(mode==='game') gameStep(dt); else H.speed=0;
  if(Wd.jobActive) Wd.jobT+=dt; if(Wd.cur>=0) Wd.times[Wd.cur]+=dt;
  H.update(dt);
}
let last=performance.now();
function frame(now){ const real=Math.min(0.05,(now-last)/1000); last=now; resize();
  if(!paused){ const n=Math.max(1,Math.ceil(speed)); for(let i=0;i<n;i++) simStep(real*speed/n); }
  camUpdate(real); hud(now); renderer.render(scene,camera); requestAnimationFrame(frame); }

applyTheme(); H.reset(); buildWorld(); buildGrid(); Wd.times=OPS.map(()=>0); renderRows(); H.update(0.016);
if(innerWidth<720){ $('timD').open=false; $('ctlD').open=false; }
start(scWalk());
window.__sim={H,OPS,get W(){return Wd;},step:simStep,start,scJob,scTool,setMode,cam,setCam,isFree,resetWorld,get task(){return task;},keys};
requestAnimationFrame(frame);
})();
</script>
